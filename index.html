<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ভূমি উন্নয়ন কর - দাখিলা রসিদ</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #111;
            font-family: 'SolaimanLipi', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .top-bar {
            background-color: #1b5e20;
            color: white;
            text-align: center;
            padding: 6px;
            font-size: 13px;
        }
        header {
            background-color: #ffffff;
            padding: 8px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #ddd;
        }
        .logo-area { display: flex; align-items: center; gap: 8px; }
        .logo-icon {
            background-color: #f9a825; color: white;
            width: 32px; height: 32px; display: flex;
            justify-content: center; align-items: center;
            font-weight: bold; border-radius: 4px;
        }
        .brand-title { font-size: 16px; font-weight: bold; }
        .action-bar {
            background-color: #f1f3f4; padding: 8px;
            text-align: center; border-bottom: 1px solid #ccc;
            display: flex; justify-content: center; gap: 12px;
        }
        .btn {
            border: none; padding: 6px 16px; border-radius: 4px;
            font-size: 13px; font-weight: bold; cursor: pointer; color: white;
            text-decoration: none; display: inline-block;
        }
        .print-btn { background-color: #1976d2; }
        .download-btn { background-color: #388e3c; }

        .viewer-container {
            flex: 1; width: 100%; height: 100%;
            background: #222; display: flex;
            justify-content: center; align-items: center;
            overflow: auto;
        }
        embed, iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .error-box {
            padding: 40px; text-align: center; color: #ff5252;
            font-size: 16px; font-weight: bold; background: white;
            width: 100%; height: 100%;
        }
    </style>
</head>
<body>

    <div class="top-bar" id="current-date-banner">লোড হচ্ছে...</div>

    <header>
        <div class="logo-area">
            <div class="logo-icon">৳</div>
            <div class="brand-title">ভূমি উন্নয়ন কর</div>
        </div>
    </header>

    <div class="action-bar">
        <button class="btn print-btn" onclick="printPdf()">🖨️ প্রিন্ট</button>
        <a id="downloadLink" href="#" download class="btn download-btn">📥 ডাউনলোড</a>
    </div>

    <div class="viewer-container" id="container"></div>

    <script>
        // বাংলা তারিখ জেনারেটর
        const days = ['রবিবার', 'সোমবার', 'মঙ্গলবার', 'বুধবার', 'বৃহস্পতিবার', 'শুক্রবার', 'শনিবার'];
        const months = ['জানুয়ারি', 'ফেব্রুয়ারি', 'মার্চ', 'এপ্রিল', 'মে', 'জুন', 'জুলাই', 'আগস্ট', 'সেপ্টেম্বর', 'অক্টোবর', 'নভেম্বর', 'ডিসেম্বর'];
        const now = new Date();
        const bDigits = ['০', '১', '২', '৩', '৪', '৫', '৬', '৭', '৮', '৯'];
        function toBn(n) { return n.toString().split('').map(d => bDigits[d] !== undefined ? bDigits[d] : d).join(''); }
        document.getElementById('current-date-banner').innerText = `${days[now.getDay()]}, ${toBn(now.getDate())} ${months[now.getMonth()]}, ${toBn(now.getFullYear())}`;

        // ইউআরএল থেকে ফাইল নাম রিড করা
        const urlParams = new URLSearchParams(window.location.search);
        const fileName = urlParams.get('file');
        const container = document.getElementById('container');
        const downloadBtn = document.getElementById('downloadLink');

        if (fileName) {
            const fileUrl = `receipts/${fileName}`;
            container.innerHTML = `<embed src="${fileUrl}" type="application/pdf">`;
            downloadBtn.href = fileUrl;
        } else {
            container.innerHTML = `<div class="error-box">⚠️ কোনো রসিদ পাওয়া যায়নি! সঠিক লিংক ব্যবহার করুন।</div>`;
        }

        function printPdf() {
            if (fileName) {
                const pdfWindow = window.open(`receipts/${fileName}`, '_blank');
                if (pdfWindow) {
                    pdfWindow.print();
                }
            } else {
                alert('প্রিন্ট করার মতো কোনো ফাইল পাওয়া যায়নি!');
            }
        }
    </script>
</body>
</html>
