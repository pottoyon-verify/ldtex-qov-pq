<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ভূমি উন্নয়ন কর - রসিদ যাচাই</title>

  <style>
    body {
      font-family: 'SolaimanLipi', Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f7f6;
      color: #333;
    }

    header {
      background-color: #006a4e;
      color: white;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-area span {
      font-size: 20px;
      font-weight: bold;
    }

    .container {
      max-width: 900px;
      margin: 20px auto;
      padding: 0 15px;
    }

    .action-buttons {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-bottom: 20px;
    }

    .btn {
      padding: 10px 20px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: white;
    }

    .btn-print {
      background-color: #2b70fa;
    }

    #receipt {
      background: white;
      padding: 5px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      min-height: 500px;
      text-align: center;
    }

    #receiptImage {
      width: 100%;
      height: auto;
      display: block;
      border: none;
      border-radius: 3px;
    }

    .error-msg {
      color: #d9534f;
      font-size: 18px;
      text-align: center;
      padding: 40px;
    }

    @media (max-width: 600px) {
      header {
        padding: 15px;
      }

      .logo-area span {
        font-size: 17px;
      }

      .container {
        margin: 20px auto;
        padding: 0 10px;
      }

      .btn {
        font-size: 15px;
        padding: 10px 18px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo-area">
      <div style="background:#f4b400; padding:5px 12px; border-radius:4px; font-weight:bold; color:black;">
        ৳
      </div>

      <span>ভূমি উন্নয়ন কর</span>
    </div>

    <div id="live-date" style="font-size:14px;"></div>
  </header>


  <div class="container">

    <div class="action-buttons">
      <button id="printBtn" onclick="printReceipt()" class="btn btn-print">
        🖨️ প্রিন্ট
      </button>
    </div>

    <div id="receipt">
      <!-- JPG রসিদ এখানে দেখা যাবে -->
    </div>

  </div>


  <script>

    /* =========================
       তারিখ দেখানো
    ========================= */

    function updateDateOnly() {

      const now = new Date();

      const options = {
        weekday: 'long',
        day: 'numeric',
        month: 'long',
        year: 'numeric'
      };

      document.getElementById('live-date').innerText =
        now.toLocaleDateString('bn-BD', options);
    }

    updateDateOnly();


    /* =========================
       URL থেকে file নেওয়া
       
       উদাহরণ:
       ?file=dakhila-3.jpg
    ========================= */

    const urlParams =
      new URLSearchParams(window.location.search);

    const requestedFile =
      urlParams.get('file');

    const receiptBox =
      document.getElementById('receipt');

    const printBtn =
      document.getElementById('printBtn');


    /* =========================
       রসিদ দেখানোর কাজ
    ========================= */

    if (requestedFile) {

      const imageUrl =
        'https://pottoyon-verify.github.io/ldtex-qov-pq/receipts/' +
        encodeURIComponent(requestedFile);


      receiptBox.innerHTML = `
        <img
          id="receiptImage"
          src="${imageUrl}"
          alt="ভূমি উন্নয়ন কর রসিদ"
          onerror="showReceiptError()"
        >
      `;


      /* =========================
         Print Button
      ========================= */

      window.printReceipt = function () {

        const printWindow =
          window.open('', '_blank');

        if (!printWindow) {

          alert(
            'প্রিন্ট করার জন্য ব্রাউজারের pop-up অনুমতি দিন।'
          );

          return;
        }


        printWindow.document.write(`

          <!DOCTYPE html>

          <html lang="bn">

          <head>

            <meta charset="UTF-8">

            <title>
              ভূমি উন্নয়ন কর রসিদ
            </title>

            <style>

              @page {
                margin: 0;
              }

              html,
              body {
                margin: 0;
                padding: 0;
                background: white;
              }

              img {
                width: 100%;
                height: auto;
                display: block;
              }

            </style>

          </head>

          <body>

            <img
              src="${imageUrl}"
              onload="window.print();"
            >

          </body>

          </html>

        `);


        printWindow.document.close();
      };


    } else {

      showReceiptError();

    }


    /* =========================
       Error
    ========================= */

    function showReceiptError() {

      receiptBox.innerHTML = `

        <div class="error-msg">

          ⚠️ দুঃখিত, কোনো রসিদ পাওয়া যায়নি।
          সঠিক লিংক ব্যবহার করুন।

        </div>

      `;

      printBtn.style.display = 'none';
    }

  </script>

</body>
</html>
