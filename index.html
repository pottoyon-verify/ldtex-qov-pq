<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ভূমি উন্নয়ন কর - রসিদ যাচাই</title>
  <style>
    body {
      font-family: 'SolaimanLipi', Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f7f6;
      color: #333;
    }
    header {
      background-color: #006a4e;
      color: white;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo-area {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo-area span {
      font-size: 20px;
      font-weight: bold;
    }
    .container {
      max-width: 900px;
      margin: 20px auto;
      padding: 0 15px;
    }
    .action-buttons {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-bottom: 20px;
    }
    .btn {
      padding: 10px 20px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: white;
    }
    .btn-print {
      background-color: #2b70fa;
    }
    .btn-download {
      background-color: #2e8b57;
    }
    #receipt {
      background: white;
      padding: 10px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      min-height: 500px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .doc-viewer, object, embed {
      width: 100%;
      height: 75vh;
      border: none;
    }
    .error-msg {
      color: #d9534f;
      font-size: 18px;
      text-align: center;
      padding: 20px;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo-area">
      <div style="background: #f4b400; padding: 5px 12px; border-radius: 4px; font-weight: bold; color: black;">৳</div>
      <span>ভূমি উন্নয়ন কর</span>
    </div>
    <div id="live-date" style="font-size: 14px;"></div>
  </header>

  <div class="container">
    <div class="action-buttons">
      <button onclick="window.print()" class="btn btn-print">🖨️ প্রিন্ট</button>
      <a id="downloadBtn" href="#" class="btn btn-download" download>📥 ডাউনলোড</a>
    </div>

    <div id="receipt">
      <!-- রসিদ এখানে লোড হবে -->
    </div>
  </div>

  <script>
    function updateDateOnly() {
      const now = new Date();
      const options = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
      document.getElementById('live-date').innerText = now.toLocaleDateString('bn-BD', options);
    }
    updateDateOnly();

    const urlParams = new URLSearchParams(window.location.search);
    let requestedFile = urlParams.get('file');
    const receiptBox = document.getElementById('receipt');
    const downloadBtn = document.getElementById('downloadBtn');

    if (requestedFile) {
      const absolutePdfUrl = `https://pottoyon-verify.github.io/ldtex-qov-pq/receipts/${requestedFile}`;
      
      // মোবাইল এবং কম্পিউটারে নিখুঁতভাবে পিডিএফ দেখানোর জন্য অবজেক্ট ও এম্বেড ট্যাগ ব্যবহার করা হলো
      receiptBox.innerHTML = `
        <object data="${absolutePdfUrl}#toolbar=0&view=FitH" type="application/pdf">
          <embed src="${absolutePdfUrl}#toolbar=0&view=FitH" type="application/pdf" />
        </object>
      `;
      downloadBtn.href = absolutePdfUrl;
    } else {
      receiptBox.innerHTML = `<div class="error-msg">⚠️ দুঃখিত, কোনো রসিদ পাওয়া যায়নি। সঠিক লিংক ব্যবহার করুন।</div>`;
      downloadBtn.style.display = 'none';
    }
  </script>

</body>
</html>
