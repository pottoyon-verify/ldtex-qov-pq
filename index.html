<DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>দাখিলা যাচাই</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  background:#ddd;
  font-family:Arial,"Noto Sans Bengali",sans-serif;
}

body{
  display:flex;
  justify-content:center;
  align-items:center;
}

.frame{
  width:100%;
  max-width:480px;
  height:100vh;
  max-height:900px;
  background:#fff;
  border-left:4px dotted #17833b;
  border-right:4px dotted #17833b;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

.date{
  background:linear-gradient(90deg,#087f39,#32a852);
  color:white;
  text-align:center;
  font-size:18px;
  font-weight:bold;
  padding:10px;
}

.print-area{
  padding:8px;
  text-align:center;
  background:#f5f5f5;
}

.print-btn{
  border:0;
  background:#0877d1;
  color:white;
  padding:10px 28px;
  border-radius:5px;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

.viewer{
  flex:1;
  overflow:auto;
  background:#eee;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  padding:8px;
}

.viewer img{
  display:block;
  width:100%;
  height:auto;
}

.viewer iframe{
  width:100%;
  height:100%;
  border:0;
  background:white;
}

.bottom{
  height:35px;
  background:linear-gradient(90deg,#087f39,#56b870,#087f39);
}
</style>
</head>

<body>

<div class="frame">

  <div class="date" id="date"></div>

  <div class="print-area">
    <button class="print-btn" onclick="printFile()">
      🖨 প্রিন্ট
    </button>
  </div>

  <div class="viewer" id="viewer">
    ফাইল লোড হচ্ছে...
  </div>

  <div class="bottom"></div>

</div>

<script>

function showDate(){

  const now = new Date();

  const days = [
    "রবিবার",
    "সোমবার",
    "মঙ্গলবার",
    "বুধবার",
    "বৃহস্পতিবার",
    "শুক্রবার",
    "শনিবার"
  ];

  const day = days[now.getDay()];
  const date = String(now.getDate()).padStart(2,"0");
  const month = String(now.getMonth()+1).padStart(2,"0");
  const year = now.getFullYear();

  document.getElementById("date").innerText =
    `${date}-${month}-${year} | ${day}`;
}


function loadFile(){

  const params = new URLSearchParams(window.location.search);

  const file = params.get("file");

  const viewer = document.getElementById("viewer");

  if(!file){
    viewer.innerHTML =
      "<div style='padding:30px;text-align:center'>ফাইল পাওয়া যায়নি</div>";
    return;
  }

  const ext = file.split(".").pop().toLowerCase();

  if(
    ext === "jpg" ||
    ext === "jpeg" ||
    ext === "png" ||
    ext === "webp" ||
    ext === "gif"
  ){

    const img = document.createElement("img");

    img.src = "files/" + file;

    img.alt = "ডকুমেন্ট";

    viewer.innerHTML = "";

    viewer.appendChild(img);

  }else if(ext === "pdf"){

    const iframe = document.createElement("iframe");

    iframe.src = "files/" + file;

    viewer.innerHTML = "";

    viewer.appendChild(iframe);

  }else{

    viewer.innerHTML =
      "<div style='padding:30px;text-align:center'>এই ফাইলটি দেখা যাচ্ছে না</div>";
  }
}


function printFile(){

  window.print();

}


showDate();
loadFile();

</script>

</body>
</html>
