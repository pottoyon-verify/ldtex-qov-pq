<!DOCTYPE html>
<html lang="bn">
  <head>
    <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
        <title>ভূমি উন্নয়ন কর - দাখিলা যাচাই</title>
        <style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:100%;background:#eef3f1;font-family:"Noto Sans Bengali",Arial,sans-serif}
body{display:flex;justify-content:center;overflow:hidden}
.frame{width:100%;max-width:830px;height:100vh;background:#fff;display:flex;flex-direction:column;overflow:hidden;border-left:4px dotted #16834a;border-right:4px dotted #16834a}
.date{flex-shrink:0;min-height:98px;display:flex;align-items:center;justify-content:center;background:#087f58;color:#fff;text-align:center;font-size:28px;font-weight:bold;padding:10px}
.print-box{flex-shrink:0;height:120px;background:#f5f5f5;display:flex;align-items:center;justify-content:center}
.print-btn{background:#087bd1;color:#fff;border:0;border-radius:12px;padding:16px 55px;font-size:28px;font-weight:bold;cursor:pointer;box-shadow:0 2px 4px rgba(0,0,0,.2)}
.viewer{flex:1;min-height:0;overflow:auto;background:#f5fbe8;padding:10px 18px;text-align:center;-webkit-overflow-scrolling:touch}
.viewer img{display:block;width:100%;height:auto;max-width:none;margin:0 auto}
.loading{padding-top:80px;color:#555;font-size:22px}
.error{padding:70px 20px;color:#c62828;font-size:24px;font-weight:bold}
.bottom{flex-shrink:0;height:58px;background:linear-gradient(90deg,#fff 0%,#73b78d 25%,#087b55 50%,#73b78d 75%,#fff 100%)}
@media(max-width:600px){.date{min-height:98px;font-size:25px}.print-box{height:120px}.print-btn{font-size:26px;padding:15px 48px}.viewer{padding:8px 16px}.bottom{height:58px}}
@media print{
html,body{width:auto;height:auto;overflow:visible;background:#fff}
.frame{width:100%;height:auto;max-width:none;border:0;overflow:visible}
.date,.print-box,.bottom{display:none}
.viewer{display:block;width:100%;height:auto;overflow:visible;padding:0;background:#fff}
.viewer img{display:block;width:100%;height:auto}
}
</style>
      </head>
      <body>
        <div class="frame">
          <div class="date" id="date">
          </div>
          <div class="print-box">
            <button class="print-btn" onclick="printImage()">🖨️ প্রিন্ট</button>
          </div>
          <div class="viewer" id="viewer">
            <div class="loading">রসিদ লোড হচ্ছে...</div>
          </div>
          <div class="bottom">
          </div>
        </div>
        <script>
function showDate(){
 const now=new Date();
 const days=["রবিবার","সোমবার","মঙ্গলবার","বুধবার","বৃহস্পতিবার","শুক্রবার","শনিবার"];
 const date=String(now.getDate()).padStart(2,"0");
 const month=String(now.getMonth()+1).padStart(2,"0");
 document.getElementById("date").innerText=`${date}-${month}-${now.getFullYear()} | ${days[now.getDay()]}`;
}
function loadImage(){
 const file=new URLSearchParams(window.location.search).get("file");
 const viewer=document.getElementById("viewer");
 if(!file){viewer.innerHTML='<div class="error">⚠️ কোনো রসিদ পাওয়া যায়নি<br><br>সঠিক QR কোড ব্যবহার করুন।</div>';return}
 const cleanFile=file.split("/").pop();
 const ext=cleanFile.split(".").pop().toLowerCase();
 if(!["jpg","jpeg","png","webp"].includes(ext)){
  viewer.innerHTML='<div class="error">⚠️ শুধু JPG / JPEG / PNG / WEBP রসিদ ব্যবহার করুন।</div>';return;
 }
 const img=document.createElement("img");
 img.src="receipts/"+encodeURIComponent(cleanFile);
 img.alt="দাখিলা রসিদ";
 img.onerror=()=>{viewer.innerHTML=`<div class="error">⚠️ রসিদ পাওয়া যায়নি<br><br><small>${cleanFile}</small></div>`};
 viewer.innerHTML="";
 viewer.appendChild(img);
}
function printImage(){window.print()}
showDate();
loadImage();
</script>
      </body>
    </html>
