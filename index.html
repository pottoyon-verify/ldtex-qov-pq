<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>ভূমি উন্নয়ন কর - রসিদ যাচাই</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'SolaimanLipi', Arial, sans-serif; }
    body { background-color: #ffffff; min-height: 100vh; overflow-x: hidden; }

    /* Green Top Header */
    .top-banner { background-color: #006a4e; color: #ffffff; text-align: center; padding: 6px 10px; font-size: 13px; font-weight: bold; }
    
    /* Navbar Area */
    .navbar { background-color: #ffffff; display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; border-bottom: 1px solid #e0e0e0; }
    .brand-section { display: flex; align-items: center; gap: 8px; }
    .logo-box { background-color: #e6a100; color: #ffffff; width: 36px; height: 36px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: bold; }
    .brand-title { font-size: 18px; font-weight: bold; color: #222222; }
    .nav-controls { display: flex; align-items: center; gap: 6px; }
    .lang-toggle { border: 1px solid #006a4e; border-radius: 4px; overflow: hidden; display: flex; }
    .lang-btn { padding: 3px 7px; font-size: 12px; font-weight: bold; cursor: pointer; }
    .lang-btn.active { background-color: #006a4e; color: #ffffff; }
    .lang-btn.inactive { background-color: #ffffff; color: #006a4e; }
    .login-btn { background-color: #006a4e; color: #ffffff; border: none; padding: 5px 10px; font-size: 12px; font-weight: bold; border-radius: 12px; display: flex; align-items: center; gap: 3px; }

    /* Hamburger Line */
    .menu-bar { background-color: #ffffff; padding: 8px 12px; border-bottom: 1px solid #e0e0e0; }
    .hamburger-icon { width: 20px; height: 14px; display: flex; flex-direction: column; justify-content: space-between; }
    .hamburger-icon span { display: block; height: 2px; background-color: #006a4e; border-radius: 1px; }

    /* Full Width Horizontal Scroll Wrapper */
    .receipt-wrapper {
      width: 100%;
      overflow-x: auto;
      background-color: #ffffff;
      padding: 10px;
      -webkit-overflow-scrolling: touch;
    }

    /* Fixed Paper Width matching original site */
    .receipt-paper {
      width: 780px;
      margin: 0 auto;
      background: #ffffff;
      color: #000000;
      font-size: 13px;
      line-height: 1.4;
      border: 1px dashed #7eb382;
      border-radius: 6px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Action Toolbar */
    .action-toolbar {
      display: flex;
      justify-content: center;
      gap: 10px;
      padding: 10px;
      background: #f0f0f0;
      border-bottom: 1px solid #ccc;
    }
    .btn { background-color: #337ab7; color: #ffffff; border: 1px solid #2e6da4; padding: 6px 18px; font-size: 14px; font-weight: bold; border-radius: 4px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }

    /* রসিদ ছবির স্টাইল */
    .receipt-img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 4px;
    }

    .error-msg {
      color: #d32f2f;
      padding: 40px;
      font-weight: bold;
      text-align: center;
      font-size: 16px;
    }

    .footer-gradient { height: 35px; background: linear-gradient(to top, #006a4e, #ffffff); width: 100%; margin-top: 20px; }

    @media print {
      .top-banner, .navbar, .menu-bar, .action-toolbar, .footer-gradient, .no-print { display: none !important; }
      body { background: #fff; padding: 0; }
      .receipt-wrapper { overflow: visible; padding: 0; }
      .receipt-paper { width: 100%; border: none; padding: 0; }
    }
  </style>
</head>
<body>

  <!-- Controls Area -->
  <div class="action-toolbar no-print">
    <button class="btn" onclick="window.print()">🖨️ প্রিন্ট</button>
    <button class="btn" onclick="downloadImage()">📥 ডাউনলোড</button>
  </div>

  <!-- Government Website Top Section -->
  <div class="top-banner" id="live-date"></div>

  <div class="navbar">
    <div class="brand-section">
      <div class="logo-box">৳</div>
      <div class="brand-title" id="brandTitle">ভূমি উন্নয়ন কর</div>
    </div>
    <div class="nav-controls">
      <div class="lang-toggle">
        <span class="lang-btn active" id="btnBn" onclick="setLanguage('bn')">বাং</span>
        <span class="lang-btn inactive" id="btnEn" onclick="setLanguage('en')">EN</span>
      </div>
      <button class="login-btn" id="loginText">
        লগইন <span>▼</span>
      </button>
    </div>
  </div>

  <div class="menu-bar">
    <div class="hamburger-icon">
      <span></span>
      <span></span>
      <span></span>
    </div>
  </div>

  <!-- Smooth Horizontal Scrolling Container -->
  <div class="receipt-wrapper">
    <div class="receipt-paper" id="receipt">
      <!-- ডায়নামিক রসিদ ছবি এখানে লোড হবে -->
    </div>
  </div>

  <div class="footer-gradient"></div>

  <script>
    // নির্দিষ্ট ফরম্যাটে তারিখ সেট করার ফাংশন
    function updateDates(lang) {
      if (lang === 'en') {
        document.getElementById('live-date').innerText = "4 September 2026";
      } else {
        document.getElementById('live-date').innerText = "২০ ভাদ্র ১৪৩৩ / ৪ সেপ্টেম্বর ২০২৬";
      }
    }

    // ভাষা পরিবর্তন করার ফাংশন (বাংলা / ইংরেজি)
    function setLanguage(lang) {
      const btnBn = document.getElementById('btnBn');
      const btnEn = document.getElementById('btnEn');
      const brandTitle = document.getElementById('brandTitle');
      const loginText = document.getElementById('loginText');

      if (lang === 'en') {
        btnEn.className = 'lang-btn active';
        btnBn.className = 'lang-btn inactive';
        brandTitle.innerText = 'Land Development Tax';
        loginText.innerHTML = 'Login <span>▼</span>';
        updateDates('en');
      } else {
        btnBn.className = 'lang-btn active';
        btnEn.className = 'lang-btn inactive';
        brandTitle.innerText = 'ভূমি উন্নয়ন কর';
        loginText.innerHTML = 'লগইন <span>▼</span>';
        updateDates('bn');
      }
    }

    updateDates('bn');

    // ইউআরএল থেকে ফাইল নাম রিড করে রসিদ লোড করার স্ক্রিপ্ট (এক্সটেনশন ছাড়া লেখার সুবিধা সহ)
    const urlParams = new URLSearchParams(window.location.search);
    let requestedFile = urlParams.get('file');
    const receiptBox = document.getElementById('receipt');
    let fileUrl = "";

    if (requestedFile) {
      requestedFile = requestedFile.trim();
      
      // যদি .jpg বা অন্য এক্সটেনশন না দেওয়া থাকে, তবে স্বয়ংক্রিয়ভাবে হ্যান্ডেল করবে
      if (!requestedFile.includes('.')) {
        if (/^\d+$/.test(requestedFile)) {
          requestedFile = `dakhila-${requestedFile}.jpg`;
        } else {
          requestedFile = `${requestedFile}.jpg`;
        }
      }
      
      fileUrl = `receipts/${requestedFile}`;
      receiptBox.innerHTML = `<img src="${fileUrl}" alt="Land Tax Receipt" class="receipt-img" id="receiptImg">`;
      
      setTimeout(() => {
        const imgElement = document.getElementById('receiptImg');
        if (imgElement) {
          imgElement.onerror = function() {
            receiptBox.innerHTML = `<div class="error-msg">⚠️ রসিদ পাওয়া যায়নি / Receipt not found<br><br><small>${requestedFile}</small></div>`;
            fileUrl = "";
          };
        }
      }, 100);

    } else {
      receiptBox.innerHTML = `<div class="error-msg">⚠️ দুঃখিত, কোনো রসিদ পাওয়া যায়নি। সঠিক লিংক ব্যবহার করুন (যেমন: ?file=1 বা ?file=dakhila-102)।</div>`;
    }

    // ডাউনলোড ফাংশন
    function downloadImage() {
      if (!fileUrl) {
        alert("ডাউনলোড করার মতো কোনো বৈধ রসিদ পাওয়া যায়নি।");
        return;
      }
      const a = document.createElement("a");
      a.href = fileUrl;
      a.download = "";
      document.body.appendChild(a);
      a.click();
      a.remove();
    }
  </script>
</body>
</html>
