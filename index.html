<DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ভূমি উন্নয়ন কর - দাখিলা রসিদ</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            font-family: 'SolaimanLipi', Arial, sans-serif;
            background-color: #222;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .top-bar {
            background-color: #1b5e20;
            color: white;
            text-align: center;
            padding: 5px;
            font-size: 13px;
        }
        header {
            background-color: #ffffff;
            padding: 8px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #ddd;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .logo-icon {
            background-color: #f9a825;
            color: white;
            width: 32px;
            height: 32px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            border-radius: 4px;
        }
        .brand-title {
            font-size: 16px;
            font-weight: bold;
        }
        .action-bar {
            background-color: #f1f3f4;
            padding: 8px;
            text-align: center;
            border-bottom: 1px solid #ccc;
            display: flex;
            justify-content: center;
            gap: 12px;
        }
        .btn {
            border: none;
            padding: 6px 16px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            color: white;
        }
        .print-btn {
            background-color: #1976d2;
        }
        .download-btn {
            background-color: #388e3c;
        }
        .viewer-container {
            flex: 1;
            width: 100%;
            height: 100%;
            background: #525659;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        /* রসিদটি যেন পুরো স্ক্রিন জুড়ে একদম বড় এবং ক্লিয়ার দেখায় */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        .error-box {
            padding: 40px;
            text-align: center;
            color: #ff5252;
            font-size: 16px;
            font-weight: bold;
            background: white;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <div class="top-bar" id="current-date-banner">লোড হচ্ছে...</div>

    <header>
        <div class="logo-area">
            <div class="logo-icon">৳</div>
            <div class="brand-title">ভূমি উন্নয়ন কর</div>
        </div>
    </header>

    <div class="action-bar">
        <button class="btn print-btn" onclick="printPdf()">🖨️ প্রিন্ট</button>
        <button class="btn download-btn" onclick="downloadPdf()">📥 ডাউনলোড</button>
    </div>

    <div class="viewer-container" id="container">
        <!-- PDF load -->
    </div>

    <script>
        // বাংলা তারিখ জেনারেটর
        const days = ['রবিবার', 'সোমবার', 'মঙ্গলবার', 'বুধবার', 'বৃহস্পতিবার', 'শুক্রবার', 'শনিবার'];
        const months = ['জানুয়ারি', 'ফেব্রুয়ারি', 'মার্চ', 'এপ্রিল', 'মে', 'জুন', 'জুলাই', 'আগস্ট', 'সেপ্টেম্বর', 'অক্টোবর', 'নভেম্বর', 'ডিসেম্বর'];
        const now = new Date();
        const bDigits = ['০', '১', '২', '৩', '৪', '৫', '৬', '৭', '৮', '৯'];
        function toBn(n) { return n.toString().split('').map(d => bDigits[d] !== undefined ? bDigits[d] : d).join(''); }
        
        document.getElementById('current-date-banner').innerText = `${days[now.getDay()]}, ${toBn(now.getDate())} ${months[now.getMonth()]}, ${toBn(now.getFullYear())}`;

        // লিংক থেকে ফাইল আইডি নেওয়া
        const urlParams = new URLSearchParams(window.location.search);
        const fileUrl = urlParams.get('file');
        const container = document.getElementById('container');
        let fileId = '';

        if (fileUrl) {
            fileId = fileUrl;
            if (fileUrl.includes('/file/d/')) {
                fileId = fileUrl.split('/file/d/')[1].split('/')[0];
            } else if (fileUrl.includes('id=')) {
                fileId = new URLSearchParams(fileUrl.split('?')[1]).get('id');
            }

            // রসিদটিকে একদম ফুল স্ক্রিন ও ক্লিয়ার দেখানোর জন্য ড্রাইভের வியూ লিংক
            const fullScreenUrl = `https://drive.google.com/file/d/${fileId}/preview?usp=drivesdk`;
            container.innerHTML = `<iframe src="${fullScreenUrl}"></iframe>`;
        } else {
            container.innerHTML = `<div class="error-box">⚠️ কোনো রসিদ পাওয়া যায়নি! সঠিক লিংক ব্যবহার করুন।</div>`;
        }

        function printPdf() {
            if (fileId) {
                window.open(`https://drive.google.com/file/d/${fileId}/view`, '_blank');
            } else {
                alert('রসিদ পাওয়া যায়নি!');
            }
        }

        function downloadPdf() {
            if (fileId) {
                window.location.href = `https://drive.google.com/uc?export=download&id=${fileId}`;
            } else {
                alert('ডাউনলোড ফাইল পাওয়া যায়নি!');
            }
        }
    </script>
</body>
</html>
