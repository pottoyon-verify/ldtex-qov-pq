<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>দাখিলা যাচাই</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  background:#eef2f1;
  font-family:"Noto Sans Bengali",Arial,sans-serif;
}

body{
  display:flex;
  justify-content:center;
}

.frame{
  width:100%;
  max-width:520px;
  height:100vh;
  background:#fff;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  border-left:3px dotted #16834a;
  border-right:3px dotted #16834a;
}

/* তারিখ */
.date{
  flex-shrink:0;
  background:#087b55;
  color:#fff;
  text-align:center;
  font-size:18px;
  font-weight:bold;
  padding:12px 5px;
}

/* প্রিন্ট */
.print-box{
  flex-shrink:0;
  background:#f5f5f5;
  text-align:center;
  padding:8px;
}

.print-btn{
  background:#087bd1;
  color:white;
  border:0;
  border-radius:6px;
  padding:10px 30px;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

/* PDF / ছবি */
.viewer{
  flex:1;
  min-height:0;
  overflow:auto;
  background:#e9eeee;
  padding:8px;
  text-align:center;
}

.viewer img{
  display:block;
  width:100%;
  height:auto;
  margin:auto;
}

.viewer iframe{
  display:block;
  width:100%;
  height:100%;
  min-height:100%;
  border:0;
  background:#fff;
}

.loading{
  padding-top:80px;
  color:#555;
  font-size:18px;
}

.error{
  padding:60px 20px;
  color:#d33;
  font-size:20px;
  font-weight:bold;
}

/* নিচের ডিজাইন */
.bottom{
  flex-shrink:0;
  height:32px;
  background:linear-gradient(
    90deg,
    #087b55,
    #43b66c,
    #087b55
  );
}

/* প্রিন্টের সময় */
@media print{

  body{
    background:white;
  }

  .frame{
    max-width:none;
    height:auto;
    border:0;
  }

  .date,
  .print-box,
  .bottom{
    display:none;
  }

  .viewer{
    overflow:visible;
    padding:0;
    background:white;
  }

  .viewer img{
    width:100%;
  }

  .viewer iframe{
    display:none;
  }
}
</style>
</head>

<body>

<div class="frame">

  <div class="date" id="date"></div>

  <div class="print-box">
    <button class="print-btn" onclick="printFile()">
      🖨 প্রিন্ট
    </button>
  </div>

  <div class="viewer" id="viewer">
    <div class="loading">ফাইল লোড হচ্ছে...</div>
  </div>

  <div class="bottom"></div>

</div>


<script>

/* =========================
   বাংলা তারিখ/দিন
========================= */

function showDate(){

  const now = new Date();

  const days = [
    "রবিবার",
    "সোমবার",
    "মঙ্গলবার",
    "বুধবার",
    "বৃহস্পতিবার",
    "শুক্রবার",
    "শনিবার"
  ];

  const day = days[now.getDay()];

  const date = String(now.getDate()).padStart(2,"0");

  const month = String(now.getMonth()+1).padStart(2,"0");

  const year = now.getFullYear();

  document.getElementById("date").innerText =
    `${date}-${month}-${year} | ${day}`;
}


/* =========================
   QR লিংক থেকে ফাইল নেওয়া
   উদাহরণ:

   ?file=101.pdf

   ?file=102.pdf
========================= */

function loadFile(){

  const params =
    new URLSearchParams(window.location.search);

  const file = params.get("file");

  const viewer =
    document.getElementById("viewer");

  if(!file){

    viewer.innerHTML = `
      <div class="error">
        ⚠️ কোনো রসিদ পাওয়া যায়নি
        <br><br>
        সঠিক QR কোড ব্যবহার করুন।
      </div>
    `;

    return;
  }


  /* নিরাপত্তার জন্য path বাদ দেওয়া */
  const cleanFile =
    file.split("/").pop();


  const fileUrl =
    "receipts/" +
    encodeURIComponent(cleanFile);


  /* ফাইলের ধরন */

  const extension =
    cleanFile
      .split(".")
      .pop()
      .toLowerCase();


  /* ছবি */

  if(
    extension === "jpg" ||
    extension === "jpeg" ||
    extension === "png" ||
    extension === "webp" ||
    extension === "gif"
  ){

    viewer.innerHTML = "";

    const img =
      document.createElement("img");

    img.src = fileUrl;

    img.alt = "রসিদ";

    img.onload = function(){
      viewer.scrollTop = 0;
    };

    img.onerror = function(){

      viewer.innerHTML = `
        <div class="error">
          ⚠️ রসিদ পাওয়া যায়নি
        </div>
      `;
    };

    viewer.appendChild(img);

  }


  /* PDF */

  else if(extension === "pdf"){

    viewer.innerHTML = "";

    const iframe =
      document.createElement("iframe");

    iframe.src = fileUrl;

    iframe.title = "PDF রসিদ";

    viewer.appendChild(iframe);

  }


  /* অন্য ফাইল */

  else{

    viewer.innerHTML = `
      <div class="error">
        ⚠️ এই ফাইলটি সমর্থিত নয়
      </div>
    `;
  }
}


/* =========================
   Print
========================= */

function printFile(){

  window.print();

}


/* চালু */

showDate();
loadFile();

</script>

</body>
</html>
